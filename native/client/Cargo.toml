[package]
name = "native-client"
version = "0.1.0"
edition = "2021"

[dependencies]
sim = { path = "../../crates/sim" }
contract = { path = "../../crates/contract" }
presentation = { path = "../../crates/presentation", features = ["files"] }
renderer-core = { path = "../../crates/renderer-core" }
kira = { version = "0.12.5", default-features = false, features = ["cpal"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "id3v2"] }
wgpu = "30.0.1"
winit = "0.30"
pollster = "0.4"
bytemuck = "1.25"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
exr = "1.74"
half = "2"

[dev-dependencies]
flate2 = "1"
