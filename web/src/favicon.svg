<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark's condensed F on the HUD's dark glass, inside the plate's
       faint accent edge and corner brackets (presentation.hud's colours). -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9"/>
      <feFlood flood-color="#73dbff" flood-opacity="0.7"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feGaussianBlur stdDeviation="0.6"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" fill="#05101a" stroke="#73dbff" stroke-opacity="0.35"/>
  <path d="M3.5 10V3.5H10M28.5 22v6.5H22" fill="none" stroke="#73dbff" stroke-width="2"/>
  <path d="M12 6.5h9.5v3.6h-5.6v3.9h4.8v3.5h-4.8v8H12z" fill="#e6f5ff" filter="url(#glow)"/>
</svg>
