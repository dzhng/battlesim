<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Armory — quadrant 3 mock</title>
<style>
:root{
  --accent:115 219 255; --text:230 245 255; --dim:143 173 194; --warn:255 204 102; --credits:250 199 64;
  --good:140 242 158; --bad:255 115 102; --glass:rgba(5,15,23,.62);
  --font: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05090d;color:rgb(var(--text));font:12px/1.35 var(--font);letter-spacing:.02em}
button{font:inherit;color:inherit}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#0a1219;border-bottom:1px solid rgb(var(--accent)/.25)}
.bar b{color:rgb(var(--accent));font-weight:600;margin-right:4px}
.seg{display:inline-flex;border:1px solid rgb(var(--accent)/.35)}
.seg button{background:none;border:0;padding:4px 9px;cursor:pointer;color:rgb(var(--dim))}
.seg button.on{background:rgb(var(--accent)/.18);color:rgb(var(--text))}
.note{color:rgb(var(--dim));font-size:11px}
#app{position:relative;height:calc(100vh - 138px);min-height:560px;overflow:hidden}
/* faux 3D yard */
.yard{position:absolute;inset:0;overflow:hidden;
  background:
   radial-gradient(ellipse 60% 30% at 50% 78%, rgba(255,190,110,.10), transparent 70%),
   linear-gradient(#2a3540 0%, #4a5560 38%, #6b6a58 39%, #4f5442 60%, #2f3328 100%);}
.yard .bldg{position:absolute;bottom:52%;background:#3a4148;border-top:3px solid #4b545c;opacity:.9}
.yard .hangar{left:8%;width:30%;height:17%;border-radius:50% 50% 0 0/100% 100% 0 0;background:#424a4f}
.yard .shed{right:10%;width:16%;height:9%}
.yard .hesco{position:absolute;bottom:47%;height:3.2%;background:repeating-linear-gradient(90deg,#8a7a58 0 14px,#6d6146 14px 16px)}
.yard .net{position:absolute;right:30%;bottom:49%;width:14%;height:7%;background:repeating-linear-gradient(45deg,#4c5a3a 0 4px,#3a4630 4px 8px);clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.yard .spot{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:52%;height:12%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.35),transparent 70%)}
.yard .unit{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);width:44%;max-height:48%;color:#1d2328;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.yard .unit svg{width:100%;height:auto;max-height:100%}
.yard .squad{position:absolute;left:50%;bottom:16%;width:30%;height:26%;transform:translateX(-50%)}
.yard .squad i{position:absolute;width:10px;height:26px;background:#1d2328;border-radius:5px 5px 2px 2px}
.yard .spotlabel{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);color:rgb(var(--film,255 163 41));font-size:11px;letter-spacing:.2em;opacity:.8}
.yard .orbit{position:absolute;right:14px;bottom:12px;color:rgb(var(--dim));font-size:11px;text-align:right}
.yard .fx{position:absolute;left:52%;bottom:44%;color:rgb(var(--warn)/.8);font-size:10px}
/* panels */
.panel{position:absolute;background:var(--glass);backdrop-filter:blur(4px);border:1px solid rgb(var(--accent)/.22);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:1px solid rgb(var(--accent)/.7)}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.h{color:rgb(var(--accent));letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{background:rgb(var(--accent)/.06);border:1px solid rgb(var(--accent)/.2);padding:4px 8px;cursor:pointer;color:rgb(var(--dim));display:flex;gap:5px;align-items:center}
.tabs button.on{background:rgb(var(--accent)/.22);color:rgb(var(--text));border-color:rgb(var(--accent)/.6)}
.tabs svg{width:16px;height:12px}
.tile{display:grid;grid-template-columns:1fr auto;gap:2px 6px;padding:6px 7px;border:1px solid rgb(var(--accent)/.14);background:rgb(var(--accent)/.04);cursor:pointer;position:relative}
.tile:hover{border-color:rgb(var(--accent)/.5)}
.tile.on{border-color:rgb(var(--accent));background:rgb(var(--accent)/.14)}
.tile.off{opacity:.45}
.tile .sil{grid-column:1/3;height:30px;color:rgb(var(--text)/.85);display:flex;align-items:center;justify-content:center}
.tile .sil svg{max-height:30px;max-width:100%}
.tile .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cr{color:rgb(var(--credits));font-size:11px}
.tile .rl{position:absolute;left:5px;top:4px;width:18px;color:rgb(var(--accent)/.8)}
.tile .rl svg{width:18px;height:13px}
.tile .fb{position:absolute;right:4px;top:3px;font-size:9px;color:rgb(var(--dim))}
.grid{display:grid;gap:4px}
.vars{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.vars button{background:none;border:1px solid rgb(var(--accent)/.25);padding:2px 6px;cursor:pointer;color:rgb(var(--dim));font-size:11px}
.vars button.on{color:rgb(var(--text));border-color:rgb(var(--accent));background:rgb(var(--accent)/.15)}
.stat{display:grid;grid-template-columns:110px 1fr 64px;gap:6px;align-items:center;margin:2px 0}
.stat .k{color:rgb(var(--dim))}
.stat .v{text-align:right}
.meter{height:6px;background:rgb(var(--accent)/.08);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:rgb(var(--accent)/.75)}
.nobar .meter{visibility:hidden}.nonum .stat .v{visibility:hidden}
.armor{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin:4px 0}
.armor div{border:1px solid rgb(var(--accent)/.2);padding:3px;text-align:center}
.armor small{display:block;color:rgb(var(--dim));font-size:9px}
.mount{border-top:1px solid rgb(var(--accent)/.15);padding:6px 0 2px}
.mount .mh{display:flex;gap:6px;align-items:center;color:rgb(var(--text))}
.mount .mh svg{width:22px;height:14px;color:rgb(var(--accent))}
.ammo{margin:4px 0 4px 28px;padding-left:6px;border-left:2px solid rgb(var(--accent)/.25)}
.ammo .an{display:flex;justify-content:space-between}
.ammo .ad{color:rgb(var(--dim));font-size:10.5px;margin:1px 0 3px}
.chips2{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.chips2 span{border:1px solid rgb(var(--accent)/.25);padding:0 4px;font-size:10px;color:rgb(var(--dim))}
.scroll{overflow:auto}
.name{font-size:17px;letter-spacing:.06em}
.sub{color:rgb(var(--dim))}
.cost{color:rgb(var(--credits));font-size:15px}
.flag{display:inline-block;border:1px solid rgb(var(--accent)/.35);padding:0 5px;margin-right:3px;font-size:10px}
.dis{color:rgb(var(--warn))}
/* reply builder */
#reply{padding:8px 12px;background:#0a1219;border-top:1px solid rgb(var(--accent)/.25);display:flex;gap:10px;align-items:flex-start}
#reply .chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.chip{border:1px solid rgb(var(--accent)/.3);padding:3px 7px;cursor:pointer;background:none;color:rgb(var(--dim));font-size:11px}
.chip.steal{border-color:rgb(var(--good));color:rgb(var(--good))}
.chip.skip{border-color:rgb(var(--bad));color:rgb(var(--bad));text-decoration:line-through}
#out{width:38%;height:62px;background:#05090d;color:rgb(var(--text));border:1px solid rgb(var(--accent)/.3);font:11px var(--font);resize:vertical}
#copy{background:rgb(var(--accent)/.2);border:1px solid rgb(var(--accent));padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="bar">
  <b>LAYOUT</b><span class="seg" id="dir"></span>
  <b>GROUPING</b><span class="seg" id="grp"></span>
  <b>FACTIONS</b><span class="seg" id="fac"></span>
  <b>STATS</b><span class="seg" id="sts"></span>
  <b>VARIANTS</b><span class="seg" id="var"></span>
</div>
<div class="bar note" id="dirnote"></div>
<div id="app"></div>
<div id="reply">
  <div style="flex:1">
    <div class="note" style="margin-bottom:4px">Click a chip once to keep it (green) and again to drop it (red). The toggles at the top are added to your reply too.</div>
    <div class="chips" id="chips"></div>
  </div>
  <textarea id="out" readonly></textarea>
  <button id="copy">COPY REPLY</button>
</div>

const FACTIONS = {us:"U.S.", europe:"European", eastern:"Eastern"};

const SPLIT = [["rec","REC"],["inf","INF"],["mbt","MBT"],["light","IFV · APC"],["arty","ARTY"],["aa","AA"],["log","LOG"],["hel","HELI"],["air","JETS"]];

const S = {dir:"warno", grp:"cat", fac:"tabs", sts:"both", var:"family", faction:"us", group:null, sel:null};

const groupOf = c => S.grp==="cat"?c.cat:split(c);

}
function sheet(c, compact){

   <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0"><span>${f}</span><span class="cost">${c.cost} CR</span></div>`;
  if(c.disabled) return h + `<div class="dis">PLANNED: ${c.disabled}</div><div class="sub">Planned weapons: ${(c.planned||[]).join(", ")||"none"}</div>`;

  h += c.men ? stat(`Strength (${c.men} men)`, c.hp, MAX.hpS, " hp") : stat("Strength", c.hp, MAX.hpV, " hp");

    let s="", seed=[...c.id].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7);
    const rnd=()=>((seed=seed*1103515245+12345>>>0)/4294967296);
    for(let i=0;i<c.men;i++){const a=rnd()*6.283,r=Math.sqrt(rnd())*42; s+=`<i style="left:${50+r*Math.cos(a)}%;top:${45+r*Math.sin(a)*0.45}%"></i>`;}
    unit = `<div class="squad">${s}</div>`;
  } else if(c?.svg) unit = `<div class="unit">${c.svg}</div>`;
  const fx = c?.mob==="air" && c.cat==="hel" ? "◌ rotors turning, blurred · engine idle" : c?.men ? "idle clip, each soldier at his own pace" : c?.disabled ? "no runtime model: silhouette card only" : c ? "engine idle loop" : "";
  return `<div class="yard"><div class="bldg hangar"></div><div class="bldg shed"></div><div class="hesco" style="left:4%;width:28%"></div><div class="hesco" style="right:6%;width:22%"></div><div class="net"></div>
   <div class="spot"></div>${unit}<div class="fx">${fx}</div><div class="spotlabel">${c?spotOf(c):""}</div>
   <div class="orbit">drag · orbit &nbsp; wheel · zoom<br>(this is a stand-in for the real 3D stage)</div></div>`;
}
function factionTabs(){
  if(S.fac==="mixed") return "";
  return `<div class="tabs" style="margin-bottom:6px">${Object.entries(FACTIONS).map(([k,l])=>`<button class="${S.faction===k?"on":""}" data-fac="${k}">${l.toUpperCase()}</button>`).join("")}</div>`;
}
function groupTabs(){
  const gl = groupList();
  if(!S.group || !gl.some(g=>g[0]===S.group)) S.group = gl[0][0];
  return `<div class="tabs" style="margin-bottom:6px">${gl.map(([k,l])=>{const n=cardsIn(k).length;return `<button class="${S.group===k?"on":""}" data-grp="${k}">${l} <span class="sub">${n}</span></button>`}).join("")}</div>`;
}
function tile(c, fam){
  const sel = S.sel && (fam? fam.some(x=>x.id===S.sel.id) : S.sel.id===c.id);
  const badge = S.fac==="mixed" ? `<span class="fb">${c.factions.map(f=>FACTIONS[f]).join(" · ")}</span>` : (fam&&fam.length>1?`<span class="fb">${fam.length} VAR</span>`:"");
  return `<div class="tile ${sel?"on":""} ${c.disabled?"off":""}" data-id="${c.id}"><span class="rl">${roleSvg(c.role)}</span>${badge}
    <div class="sil">${c.svg||""}</div><span class="nm">${S.var==="family"&&fam?c.fam.toUpperCase():c.name.toUpperCase()}</span><span class="cr">${c.cost}</span></div>`;
}
function listing(cols){
  const list = cardsIn(S.group);
  if(S.var==="family"){
    return `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${families(list).map(f=>tile(f[0],f)).join("")}</div>`;
  }
  return `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${list.map(c=>tile(c)).join("")}</div>`;
}
function variantPicker(){
  if(S.var!=="family"||!S.sel) return "";
  const fam = DATA.cards.filter(c=>c.fam===S.sel.fam && inFaction(c));
  if(fam.length<2) return "";
  return `<div class="vars">${fam.map(c=>`<button class="${c.id===S.sel.id?"on":""}" data-id="${c.id}">${c.variant}</button>`).join("")}</div>`;
}
function render(){
  for(const k in opts) for(const b of document.getElementById(k).children) b.classList.toggle("on", b.dataset.v===S[k]);
  document.getElementById("dirnote").textContent = DIRNOTE[S.dir];
  groupTabs();
  if(!S.sel || !inFaction(S.sel) || groupOf(S.sel)!==S.group) S.sel = cardsIn(S.group)[0] || null;
  const cls = S.sts==="num"?"nobar":S.sts==="bars"?"nonum":"";
  const app = document.getElementById("app");
  if(S.dir==="warno"){
    app.innerHTML = yard(S.sel) +
     `<div class="panel scroll" style="left:12px;top:12px;bottom:12px;width:330px;padding:10px"><div class="h" style="margin-bottom:6px">ARMORY</div>${factionTabs()}${groupTabs()}${listing(3)}</div>
      <div class="panel scroll ${cls}" style="right:12px;top:12px;bottom:12px;width:340px;padding:10px">${sheet(S.sel)}${variantPicker()}</div>`;
  } else if(S.dir==="ba"){
    const list = cardsIn(S.group); const items = S.var==="family"? families(list).map(f=>tile(f[0],f)) : list.map(c=>tile(c));
    app.innerHTML = yard(S.sel) +
     `<div class="panel" style="left:12px;top:12px;padding:8px">${factionTabs()}${groupTabs()}</div>
      <div class="panel scroll ${cls}" style="right:12px;top:12px;width:300px;max-height:62%;padding:10px">${sheet(S.sel,true)}${variantPicker()}</div>
      <div class="panel" style="left:12px;right:12px;bottom:12px;padding:8px;overflow-x:auto"><div style="display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:4px">${items.join("")}</div></div>`;
  } else {
    const tree = (S.fac==="mixed"?[null]:[S.faction]).map(()=>groupList().map(([g,l])=>{
      const fams = families(cardsIn(g)); if(!fams.length) return "";
      return `<div style="margin:6px 0 2px" class="h">${l}</div>`+fams.map(f=>`<div style="padding:1px 0 1px 8px;cursor:pointer;${f.some(x=>x.id===S.sel?.id)?"color:rgb(var(--accent))":""}" data-id="${f[0].id}">${f[0].fam}${f.length>1&&S.var==="family"?` <span class="sub">(${f.length})</span>`:""}</div>`+(S.var==="flat"&&f.length>1?f.map(c=>`<div class="sub" style="padding-left:20px;cursor:pointer" data-id="${c.id}">${c.variant}</div>`).join(""):"")).join("");
    }).join("")).join("");
    app.innerHTML = `<div style="position:absolute;inset:0;background:#070d12"></div>
     <div class="panel scroll" style="left:12px;top:12px;bottom:12px;width:250px;padding:10px">${factionTabs()}${tree}</div>
     <div class="panel" style="left:274px;top:12px;right:12px;height:42%;overflow:hidden">${yard(S.sel)}</div>
     <div class="panel scroll ${cls}" style="left:274px;right:12px;top:calc(42% + 22px);bottom:12px;padding:10px;columns:2;column-gap:24px">${sheet(S.sel)}${variantPicker()}</div>`;
  }
  app.querySelectorAll("[data-fac]").forEach(b=>b.onclick=()=>{S.faction=b.dataset.fac;S.sel=null;render();});
  app.querySelectorAll("[data-grp]").forEach(b=>b.onclick=()=>{S.group=b.dataset.grp;S.sel=null;render();});
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const c=DATA.cards.find(x=>x.id===b.dataset.id);S.sel=c;S.group=groupOf(c);render();});
  writeReply();
}
const CHIPS = [
  "the yard fills the whole screen behind the panels","list on the left, sheet on the right (A)","bottom carousel (B)","printable two-column sheet (C)",
  "role symbol on each tile","silhouette on each tile","cost on each tile","armour as a four-facing block","bars scaled to the roster's best",
  "weapon description line","per-layer ranges","target classes ('vs vehicle')","aim and reload seconds","shared units appear in every faction",
  "planned drones shown greyed","idle-effect caption","a compare mode (pin two units)",
];
const chipState = {};
const cel = document.getElementById("chips");
for(const t of CHIPS){const b=document.createElement("button");b.className="chip";b.textContent=t;b.onclick=()=>{chipState[t]=chipState[t]==="steal"?"skip":chipState[t]==="skip"?undefined:"steal";b.className="chip "+(chipState[t]||"");writeReply();};cel.appendChild(b);}
function writeReply(){
  const lab = k => opts[k].find(o=>o[0]===S[k])[1];
  const steal = Object.entries(chipState).filter(([,v])=>v==="steal").map(([k])=>k);
  const skip = Object.entries(chipState).filter(([,v])=>v==="skip").map(([k])=>k);
  document.getElementById("out").value =
`Layout: ${lab("dir")} · Grouping: ${lab("grp")} · Factions: ${lab("fac")} · Stats: ${lab("sts")} · Variants: ${lab("var")}
Keep: ${steal.join("; ")||"—"}
Drop: ${skip.join("; ")||"—"}
Notes: `;
}
document.getElementById("copy").onclick=()=>{navigator.clipboard?.writeText(document.getElementById("out").value);};
render();
</script>
</body>
</html>
