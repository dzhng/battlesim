[package]
name = "sim"
version = "0.1.0"
edition = "2021"
# The integration tests are modules of one binary (tests/main.rs).
autotests = false

[dependencies]
contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The movement scenario runner's flip-books encode PNGs (examples/movement_shots.rs).
png = "0.17"

[[test]]
name = "sim"
path = "tests/main.rs"

[[example]]
name = "cover_report"
test = true
