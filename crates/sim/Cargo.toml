[package]
name = "sim"
version = "0.1.0"
edition = "2021"
# The integration tests are modules of one binary (tests/main.rs).
autotests = false

[dependencies]
contract = { path = "../contract" }
serde.workspace = true
serde_json.workspace = true
libm.workspace = true

[build-dependencies]
contract = { path = "../contract" }

[dev-dependencies]
# The movement scenario runner's flip-books encode PNGs (examples/movement_shots.rs).
png = "0.17"
sha2 = "0.10"

[[test]]
name = "sim"
path = "tests/main.rs"

[[example]]
name = "cover_report"
test = true

# Its admission tests run with the workspace suite.
[[example]]
name = "mechanics_validate"
test = true

# Native-only tests and examples may use std math; the library denies it (crates/clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
