[package]
name = "renderer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
pollster = "0.4"
