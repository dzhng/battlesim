[package]
name = "renderer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
png = "0.17"
presentation = { path = "../presentation" }
contract = { path = "../contract" }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }

serde.workspace = true
serde_json.workspace = true

sha2 = "0.10"
ryu-js = "1"
libm.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
contract = { path = "../contract" }
half = "2"
wgpu = "30.0.1"
pollster = "0.4"
presentation = { path = "../presentation", features = ["files"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
