[package]
name = "renderer-wasm-spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
bytemuck = "1.25"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
