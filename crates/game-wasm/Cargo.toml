[package]
name = "game-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sim = { path = "../sim" }
contract = { path = "../contract" }
mapgen = { path = "../mapgen" }
serde_json.workspace = true

serde.workspace = true

# wasm-opt's -O1 ships a smaller download after compression than its default
# -O, in a sixth of the time; Rust's own release build has already optimized.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
