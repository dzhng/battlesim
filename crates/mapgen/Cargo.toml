[package]
name = "mapgen"
version = "0.1.0"
edition = "2021"

[dependencies]
contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# Verification loads generated maps into the simulation, including the battle sweep.
sim = { path = "../sim" }

[[example]]
name = "battle_sweep"
test = true

[[example]]
name = "map_workbench_report"
test = true
