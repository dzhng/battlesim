[package]
name = "mapgen"
version = "0.1.0"
edition = "2021"

[dependencies]
contract = { path = "../contract" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sim = { path = "../sim" }
libm.workspace = true

[[example]]
name = "battle_sweep"
test = true

[[example]]
name = "map_workbench_report"
test = true

[[example]]
name = "skirmish_tournament"
path = "examples/skirmish_tournament/main.rs"
test = true

# Native-only tests and examples may use std math; the library denies it (crates/clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
