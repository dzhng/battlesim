[package]
name = "mapgen"
version = "0.1.0"
edition = "2021"

[dependencies]
contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# Verification loads generated maps into the simulation, including the battle sweep.
sim = { path = "../sim" }

[[example]]
name = "battle_sweep"
test = true

[[example]]
name = "map_workbench_report"
test = true

[[example]]
name = "skirmish_tournament"
path = "examples/skirmish_tournament/main.rs"
test = true

# Native-only tests and examples may use std math; the library denies it (crates/clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
