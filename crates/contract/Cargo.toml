[package]
name = "contract"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10"
libm = { version = "=0.2.16", default-features = false }

# Native-only tests and examples may use std math; the library denies it (crates/clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
