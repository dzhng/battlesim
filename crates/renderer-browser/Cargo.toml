[package]
name = "renderer-browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
presentation-wasm = { path = "../presentation-wasm" }
renderer-core = { path = "../renderer-core" }
presentation = { path = "../presentation" }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
bytemuck = "1.25"
