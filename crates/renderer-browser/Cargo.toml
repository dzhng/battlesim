[package]
name = "renderer-browser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
renderer-core = { path = "../renderer-core" }
native-client = { path = "../../native/client" }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
pollster = "0.4"
bytemuck = "1.25"
