[package]
name = "presentation"
version = "0.1.0"
edition = "2021"

[features]
# Reads the repository's runtime assets and fixtures from disk (native).
files = ["dep:flate2"]

[dependencies]
sim = { path = "../sim" }
contract = { path = "../contract" }
serde = { version = "1", features = ["derive", "rc"] }
# Every number a file holds reads back to its own bits: a bundle's joints
# and bounds, the fixtures' tunings and the recorded vectors alike.
serde_json.workspace = true
serde_path_to_error = "0.1"
bytemuck = "1.25"
# One implementation of the transcendental functions for WebAssembly and
# native, so both clients place, cull and synthesize alike.
libm = { version = "=0.2.16", default-features = false }
flate2 = { version = "1", optional = true }

[dev-dependencies]
# The tests read the repository's files as native does.
presentation = { path = ".", features = ["files"] }
# The ground's meshes are tested on saved maps as the simulation builds them.
contract = { path = "../contract" }

# Native-only tests and examples may use std math; the library denies it (crates/clippy.toml).
[lints.clippy]
disallowed_methods = "allow"
